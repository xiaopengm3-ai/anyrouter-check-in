name: 仓库保活

# GitHub 会在仓库长期无提交时自动禁用 Actions，
# 这里每月提交一个时间戳文件，让仓库保持"活跃"，签到工作流就不会被停。

on:
  schedule:
    - cron: '0 3 1 * *'      # 每月 1 号 03:00 UTC（北京 11:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 更新时间戳
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
          echo "当前时间: $(cat .keepalive)"

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --staged --quiet; then
            echo "无变化，跳过"
          else
            git commit -m "chore: 保活 $(date -u '+%Y-%m')"
            git push
          fi
